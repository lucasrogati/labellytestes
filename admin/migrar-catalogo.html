<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migrar catálogo | La Belly</title><link rel="stylesheet" href="css/admin.css"></head><body class="admin-login-page"><main class="login-card" style="max-width:700px"><a class="admin-brand" href="index.html">La Belly</a><p class="admin-kicker">Migração única</p><h1>Migrar catálogo local</h1><p class="small-note">Use apenas uma vez, após executar o SQL e criar seu usuário admin. Produtos duplicados podem ser criados caso execute novamente.</p><button id="migrate" class="primary-btn">Iniciar migração</button><pre id="log" class="small-note" style="white-space:pre-wrap"></pre></main><script src="../js/app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-client.js"></script><script src="../js/fallback-products.js"></script><script src="js/admin-auth.js"></script><script>document.getElementById('migrate').onclick=async()=>{const log=t=>document.getElementById('log').textContent+=t+'\n';const user=await adminGuard();if(!user)return;const db=supabaseClient;let map={};for(const name of [...new Set(PRODUCTS.map(x=>x.categoria))]){let slug=name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');let {data,error}=await db.from('categorias').insert({nome:name,slug,ordem:Object.keys(map).length}).select().single();if(error){const q=await db.from('categorias').select().eq('slug',slug).single();data=q.data;if(!data){log('Erro categoria '+name+': '+error.message);continue}}map[name]=data.id;log('Categoria: '+name)}for(const p of PRODUCTS){let {data,error}=await db.from('produtos').insert({nome:p.nome,categoria_id:map[p.categoria],preco:p.preco,preco_promocional:p.precoPromocional,descricao:p.descricao,descricao_detalhada:p.descricaoDetalhada,tamanhos:p.tamanhos||[],cores:Array.isArray(p.cor)?p.cor:(p.cor?[p.cor]:[]),estoque:p.estoque!==false,novidade:!!p.novidade,destaque:!!p.destaque,ativo:true,ordem:p.id}).select().single();if(error){log('Erro produto '+p.nome+': '+error.message);continue}for(let i=0;i<(p.imagens||[p.imagem]).length;i++){let url=(p.imagens||[p.imagem])[i];await db.from('produto_imagens').insert({produto_id:data.id,url,texto_alternativo:p.nome,ordem:i})}log('Produto: '+p.nome)}log('Concluído. As URLs das imagens ainda são locais; envie imagens reais pelo painel para usar Storage.');}</script></body></html>
